<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSCPP Terminal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="terminal-shell">
      <div class="terminal-window">
        <div class="title-bar">
          <div class="title-brand">
            <div class="knobs">
              <span class="knob"></span>
              <span class="knob"></span>
              <span class="knob"></span>
            </div>
            <div class="title-icon">
              <img src="TSCPP.png" alt="Website thumbnail" />
            </div>
            <div class="title-text">TSCPP - Terminal</div>
          </div>
        </div>
        <div class="terminal-screen">
          <div class="scanlines"></div>
          <div class="terminal-content">
            <div class="line timer-line">Timeout in: <span id="timeoutTimer">20:00</span></div>
            <div class="line typing prompt">TSCPP@server:~$ <span class="green-text">connect</span></div>
            <div class="line typing">Connecting to TSCPP Discord...</div>
            <div class="line typing">Server status: <span class="status">ONLINE</span></div>
            <div class="line typing">Members: <strong id="memberCount">Loading...</strong></div>
            <div class="line typing">Channels: <strong>TERMINAL</strong></div>
            <div class="line typing">Theme: <span class="status">GREY</span></div>
            <div class="line typing">Last sync: <span class="timestamp">Now</span></div>
            <div class="line typing">Type <span class="green-text">help</span> for commands.</div>
            <div class="line prompt input-line">TSCPP@server:~$ <input id="commandInput" autocomplete="off" spellcheck="false" /></div>
          </div>
        </div>
      </div>
    </div>
    <script src="terminal-common.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const typingLines = Array.from(document.querySelectorAll('.terminal-content .line.typing'));
        const commandInput = document.getElementById('commandInput');
        const memberCountTarget = document.getElementById('memberCount');

        // for member counter
        const discordGuildId = '1492600121668534553';
        async function fetchDiscordMemberCount() {
          if (!memberCountTarget) return;
          if (!discordGuildId) {
            memberCountTarget.textContent = 'UNAVAILABLE';
            return;
          }

          try {
            const response = await fetch(`https://discord.com/api/guilds/${discordGuildId}/widget.json`);
            if (!response.ok) throw new Error('Discord widget unavailable');
            const data = await response.json();
            if (data && Array.isArray(data.members)) {
              memberCountTarget.textContent = data.members.length;
            } else if (data && typeof data.presence_count === 'number') {
              memberCountTarget.textContent = data.presence_count;
            } else {
              memberCountTarget.textContent = 'UNAVAILABLE';
            }
          } catch (error) {
            console.warn('Discord member count fetch failed:', error);
            memberCountTarget.textContent = 'UNAVAILABLE';
          }
        }

        fetchDiscordMemberCount();

        function wait(ms) {
          return new Promise(resolve => setTimeout(resolve, ms));
        }

        function cloneStructure(sourceNode, targetTextNodes) {
          if (sourceNode.nodeType === Node.TEXT_NODE) {
            const textNode = document.createTextNode('');
            targetTextNodes.push({ source: sourceNode.nodeValue, target: textNode });
            return textNode;
          }

          const clone = document.createElement(sourceNode.tagName);
          for (const attr of sourceNode.attributes) {
            clone.setAttribute(attr.name, attr.value);
          }

          sourceNode.childNodes.forEach(child => clone.appendChild(cloneStructure(child, targetTextNodes)));
          return clone;
        }

        async function typeLine(line, lineIndex) {
          const originalHtml = line.innerHTML;
          const parser = new DOMParser();
          const doc = parser.parseFromString(`<div>${originalHtml}</div>`, 'text/html');
          const sourceRoot = doc.body.firstElementChild;

          const targetTextNodes = [];
          line.innerHTML = '';
          const fragment = document.createDocumentFragment();
          fragment.appendChild(cloneStructure(sourceRoot, targetTextNodes));
          line.appendChild(fragment);
          line.classList.add('active');

          await wait(lineIndex === 0 ? 300 : 120);

          for (const { source, target } of targetTextNodes) {
            for (let i = 0; i < source.length; i++) {
              target.nodeValue += source[i];
              const charDelay = 16 + Math.random() * 30;
              await wait(charDelay);
            }
          }
        }

        function appendOutput(text, cssClass = '') {
          const line = document.createElement('div');
          line.className = `line ${cssClass}`.trim();
          line.textContent = text;
          commandInput.closest('.terminal-content').insertBefore(line, commandInput.parentElement);
          line.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function handleCommand(command) {
          const normalized = command.trim().toLowerCase();
          if (!normalized) return;

          if (handleSessionCommand(normalized, appendOutput)) return;

          const disabled = disabledCommands[normalized];
          if (disabled) {
            appendOutput(`Command ${normalized} is temporarily unavailable [${disabled.code}] - ${disabled.reason}.`, 'typing active');
            return;
          }

          if (handleThemeCommand(normalized, appendOutput)) return;

          if (normalized === 'help') {
            appendOutput('Opening help page...', 'typing active');
            setTimeout(() => window.location.href = 'page2.html', 600);
            return;
          }

          if (normalized === 'page2' || normalized === 'goto page2' || normalized === 'open page2') {
            appendOutput('Opening help page...', 'typing active');
            setTimeout(() => window.location.href = 'page2.html', 600);
            return;
          }

          if (normalized === 'info' || normalized === 'about' || normalized === 'information' || normalized === 'open information' || normalized === 'open info') {
            appendOutput('Opening About TSCPP page...', 'typing active');
            setTimeout(() => window.location.href = 'information.html', 600);
            return;
          }

          if (normalized === 'status' || normalized === 'open status') {
            appendOutput('Opening Status page...', 'typing active');
            setTimeout(() => window.location.href = 'status.html', 600);
            return;
          }

          if (normalized === 'lore') {
            appendOutput('Lore command active.', 'typing active');
            return;
          }

          if (normalized === 'discord' || normalized === 'open discord') {
            appendOutput('Opening Discord page...', 'typing active');
            setTimeout(() => window.location.href = 'discord.html', 600);
            return;
          }

          if (normalized === 'rules' || normalized === 'open rules') {
            appendOutput('Opening Rules page...', 'typing active');
            setTimeout(() => window.location.href = 'rules.html', 600);
            return;
          }

          if (normalized === 'errors' || normalized === 'errorcodes' || normalized === 'error codes' || normalized === 'open errors') {
            appendOutput('Opening error codes page...', 'typing active');
            setTimeout(() => window.location.href = 'errorcodes.html', 600);
            return;
          }

          if (normalized === 'home' || normalized === 'index') {
            appendOutput('Already on the home page.', 'typing active');
            return;
          }

          appendOutput(`Command not found: ${command} [E001] - invalid command. Type errorcodes for details.`, 'typing active');
        }

        commandInput.focus();
        commandInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            const command = commandInput.value;
            appendOutput(`TSCPP@server:~$ ${command}`, 'prompt');
            commandInput.value = '';
            handleCommand(command);
          }
        });

        initializeSessionTimeout(commandInput, appendOutput);

        (async () => {
          for (let i = 0; i < typingLines.length; i++) {
            await typeLine(typingLines[i], i);
          }
          commandInput.focus();
        })();
      });
    </script>
  </body>
</html>
