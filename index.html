<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSCPP Terminal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="terminal-shell">
      <div class="terminal-window">
        <div class="title-bar">
          <div class="knobs">
            <span class="knob"></span>
            <span class="knob"></span>
            <span class="knob"></span>
          </div>
          <div class="title-text">TSCPP - DISCORD SERVER</div>
        </div>
        <div class="terminal-screen">
          <div class="scanlines"></div>
          <div class="terminal-content">
            <div class="line prompt">TSCPP@server:~$ <span class="green-text">connect</span></div>
            <div class="line">Connecting to TSCPP Discord...</div>
            <div class="line">Server status: <span class="status">ONLINE</span></div>
            <div class="line">Members: <strong>245</strong></div>
            <div class="line">Channels: <strong>General • Dev • Bot • Announcements</strong></div>
            <div class="line">Theme: <span class="status">GREY TERMINAL MODE</span></div>
            <div class="line">Last sync: <span class="timestamp">2026-04-26 18:42:11</span></div>
            <div class="line">Type <span class="green-text">help</span> for commands.</div>
            <div class="line prompt">TSCPP@server:~$ <span class="cursor">█</span></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
